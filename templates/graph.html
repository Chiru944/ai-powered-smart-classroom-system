<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Period Wise Graph</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    background:#121212;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    width:90%;
    margin:auto;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

h1{
    text-align:center;
}

button{
    padding:10px 20px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    margin-bottom:10px;
    cursor:pointer;
}
</style>


<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>Period Wise Classroom Graph</h1>

<div class="card">
<button onclick="loadGraph()">Load Graph</button>
<button onclick="downloadGraph()">Export Graph</button>
</div>

<div class="card">
<canvas id="engagementChart"></canvas>
</div>

<div class="card">
<canvas id="studentsChart"></canvas>
</div>

</div>

<script>

let engagementChart;
let studentsChart;

function loadGraph(){

    fetch('/period_graph_data')
    .then(response => response.json())
    .then(data => {

        const ctx1 =
        document.getElementById(
        'engagementChart'
        );

        const ctx2 =
        document.getElementById(
        'studentsChart'
        );

        if(engagementChart){
            engagementChart.destroy();
        }

        if(studentsChart){
            studentsChart.destroy();
        }

        engagementChart =
        new Chart(ctx1, {

            type:'line',

            data:{
                labels:data.periods,

                datasets:[
                    {
                        label:'Engagement %',
                        data:data.engagement,
                        borderColor:'#22d3ee',
                        backgroundColor:'rgba(34,211,238,.14)',
                        fill:true,
                        tension:0.4
                    },
                    {
                        label:'Distracted Students',
                        data:data.distracted,
                        borderColor:'#f87171',
                        backgroundColor:'rgba(248,113,113,.10)',
                        fill:true,
                        tension:0.4
                    }
                ]
            },

            options:{
                responsive:true,
                plugins:{
                    title:{
                        display:true,
                        text:'Engagement and Distraction by Period',
                        color:'white'
                    },
                    legend:{
                        labels:{
                            color:'white'
                        }
                    }
                },
                scales:{
                    x:{
                        ticks:{color:'white'},
                        grid:{color:'rgba(148,163,184,.15)'}
                    },
                    y:{
                        ticks:{color:'white'},
                        grid:{color:'rgba(148,163,184,.15)'}
                    }
                }
            }

        });

        studentsChart =
        new Chart(ctx2, {

            type:'bar',

            data:{
                labels:data.periods,

                datasets:[
                    {
                        label:'Total Students',
                        data:data.students,
                        backgroundColor:'rgba(59,130,246,.78)', borderRadius:8
                    },
                    {
                        label:'Attentive Students',
                        data:data.attentive,
                        backgroundColor:'rgba(34,197,94,.78)', borderRadius:8
                    },
                    {
                        label:'Distracted Students',
                        data:data.distracted,
                        backgroundColor:'rgba(239,68,68,.78)', borderRadius:8
                    }
                ]
            },

            options:{
                responsive:true,
                plugins:{
                    title:{
                        display:true,
                        text:'Students Count by Period',
                        color:'white'
                    },
                    legend:{
                        labels:{
                            color:'white'
                        }
                    }
                },
                scales:{
                    x:{
                        ticks:{color:'white'},
                        grid:{color:'rgba(148,163,184,.15)'}
                    },
                    y:{
                        beginAtZero:true,
                        ticks:{color:'white'},
                        grid:{color:'rgba(148,163,184,.15)'}
                    }
                }
            }

        });

    });

}

function downloadGraph(){

    let link =
    document.createElement('a');

    link.download =
    'period_graph.png';

    link.href =
    document.getElementById(
    'engagementChart'
    ).toDataURL();

    link.click();
}

loadGraph();

</script>

</body>
</html>
