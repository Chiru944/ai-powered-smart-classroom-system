<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Period Report</title>

<style>
body{
    font-family:Arial;
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#007bff;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

button{
    padding:10px 20px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    margin-bottom:20px;
}
</style>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Period Wise Classroom Report</h1>

<button onclick="loadReport()">Load Report</button>

<table>
<thead>
<tr>
    <th>Date</th>
    <th>Subject Code</th>
    <th>Period</th>
    <th>No. of Students Present</th>
    <th>Engagement %</th>
    <th>Distracted Students</th>
</tr>
</thead>

<tbody id="reportBody"></tbody>
</table>

<script>

function loadReport(){

    fetch('/period_report_data')
    .then(response => response.json())
    .then(data => {

        let body = document.getElementById("reportBody");

        body.innerHTML = "";

        if(data.length === 0){

            body.innerHTML = `
            <tr>
                <td colspan="6">No report data available</td>
            </tr>
            `;

            return;
        }

        data.forEach(row => {

            body.innerHTML += `
            <tr>
                <td>${row.date}</td>
                <td>${row.subject_code}</td>
                <td>${row.period}</td>
                <td>${row.students_present}</td>
                <td>${row.engagement}%</td>
                <td>${row.distracted}</td>
            </tr>
            `;

        });

    })
    .catch(error => {
        console.log(error);
        alert("Report loading failed");
    });
}

</script>

</body>
</html>
