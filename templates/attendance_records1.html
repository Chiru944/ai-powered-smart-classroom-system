<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Records</title>

<style>
body{
    background:#121212;
    color:white;
    font-family:Arial;
    padding:20px;
}

h2{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#1e1e1e;
}

th{
    background:#007bff;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #333;
}

tr:hover{
    background:#2a2a2a;
}

.btn{
    display:inline-block;
    background:#007bff;
    color:white;
    padding:10px 15px;
    text-decoration:none;
    border-radius:5px;
    margin-bottom:15px;
}
</style>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h2>Attendance Records</h2>



<table>
<tr>
    <th>ID</th>
    <th>USN</th>
    <th>Name</th>
    <th>Subject Code</th>
    <th>Date</th>
    <th>Period</th>
    <th>Status</th>
    <th>Entry Time</th>
</tr>

{% for row in records %}
<tr>
    <td>{{ row['id'] }}</td>
    <td>{{ row['usn'] }}</td>
    <td>{{ row['name'] }}</td>
    <td>{{ row['subject_code'] }}</td>
    <td>{{ row['date'] }}</td>
    <td>{{ row['period'] }}</td>
    <td>{{ row['status'] }}</td>
    <td>{{ row['entry_time'] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
